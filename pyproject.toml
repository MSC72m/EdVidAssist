[project]
name = "edvidassist"
version = "0.1.0"
description = "Semantic video extraction and assembly"
requires-python = ">=3.11"
dependencies = [
    "click",
    "httpx",
    "litellm",
    "numpy",
    "pydantic>=2.0.0",
    "pymupdf",
    "pysubs2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]
license = {text = "AGPL-3.0"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/edvidassist"]
include = ["src/edvidassist/templates/*.typ"]
[project.scripts]
edvidassist = "edvidassist.__main__:main"
